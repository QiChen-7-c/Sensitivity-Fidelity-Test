log_dir: outputs/afno

model:
    in_channels: 4
    out_channels: 4
    in_time_window: 1
    out_time_window: 20
    patch_size: 4
    hidden_size: 128
    depth: 8
    num_blocks: 8
    mlp_ratio: 4.0
    drop_rate: 0.0
    drop_path_rate: 0.05
    uniform_drop: false
    sparsity_threshold: 0.01
    hard_thresholding_fraction: 1.0
    hidden_size_factor: 1
    double_skip: true
    use_pos_embed: true
    activation_checkpointing: false
    data_loss_weight: 1
    afno_kwargs: {}

data:
    data_folder: './data/'
    train_data_files:
      - train_data.npy
    test_data_files:
      - test_data.npy
    nx: 128
    ny: 64
    stride: 1
    subsample_rate: 10
    normalize: True

training:
    epochs: 100
    lr: 0.001
    batch_size: 16
    warmup_epochs: 10
    warmup_start_factor: 0.001
    min_lr: 1.0e-6
    scheduler_step: 5
    scheduler_gamma: 0.7
